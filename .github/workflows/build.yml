name: N60Pro Firmware Build

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: '忽略缓存全新编译'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '0 18 * * 5'   # 每周六 02:00 (UTC+8) 自动跟源码重编

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  CONFIG_FILE: configs/n60pro.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -hT

      - name: Init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp \
            nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Cache toolchain
        if: inputs.clean_cache != true
        uses: actions/cache@v4
        with:
          path: |
            staging_dir
            toolchain
            .ccache
          key: n60pro-toolchain-${{ env.REPO_BRANCH }}-${{ hashFiles('configs/n60pro.config') }}
          restore-keys: n60pro-toolchain-${{ env.REPO_BRANCH }}-

      - name: Clone source
        run: |
          df -hT $PWD
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "=== source head ==="
          git log -1 --format='%h %s (%cd)' --date=short

      - name: Apply feeds + 512ROM profile
        working-directory: openwrt
        run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Copy files overlay
        run: |
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            cp -r $GITHUB_WORKSPACE/files/* openwrt/
          fi
          ls openwrt/target/linux/mediatek/dts/ | grep 512rom

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          if ! grep -Fxq 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro-512rom=y' .config; then
            echo "::error::N60 Pro 512ROM target was not selected after make defconfig"
            exit 1
          fi
          forbidden_packages=(
            kmod-usb-serial
            kmod-usb-serial-option
            kmod-usb-serial-wwan
            kmod-usb-net
            kmod-usb-net-qmi-wwan
            kmod-usb-net-cdc-mbim
            kmod-usb-net-cdc-ncm
            kmod-usb-net-cdc-ether
            kmod-usb-net-cdc-subset
            kmod-usb-net-rndis
            kmod-usb-net-huawei-cdc-ncm
            kmod-mhi
            uqmi
            umbim
            qmodem
            luci-app-qmodem-next
            kmod-usb-ledtrig-usbport
          )
          for package in "${forbidden_packages[@]}"; do
            if grep -Fxq "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Removed package '${package}' is still selected after make defconfig"
              exit 1
            fi
          done
          required_packages=(
            kmod-usb3
            kmod-usb-storage
            kmod-usb-storage-uas
            kmod-usb-storage-extras
            automount
            autocore
            luci-app-turboacc-mtk
            luci-app-filemanager
            luci-app-netspeedtest
            luci-app-package-manager
            luci-app-passwall
            luci-app-usteer
            luci-i18n-base-zh-cn
            luci-i18n-firewall-zh-cn
            luci-i18n-passwall-zh-cn
            luci-i18n-usteer-zh-cn
            dnsmasq-full
            usteer
            luci-lib-chartjs
            luci-theme-bootstrap
            sing-box
            xray-core
            ipt2socks
            v2ray-plugin
            shadowsocks-rust-sslocal
            shadowsocksr-libev-ssr-local
            shadowsocksr-libev-ssr-redir
            homebox
            ookla-speedtest
            iperf3
          )
          for package in "${required_packages[@]}"; do
            if ! grep -Fxq "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Required package '${package}' was not selected after make defconfig"
              exit 1
            fi
          done
          echo "=== device check ==="
          grep -E 'TARGET_DEVICE|turboacc' .config | head -30 || true

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -la {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        working-directory: openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Check space usage
        if: steps.compile.outputs.status == 'success'
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-bin
          path: openwrt/bin

      - name: Organize release files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          cp $GITHUB_WORKSPACE/README.md ./
          echo "FILEPATH=$PWD" >> $GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: N60Pro_${{ github.run_number }}_${{ github.run_id }}
          files: ${{ env.FILEPATH }}/*
          body: |
            ## 磊科 N60 Pro 定制固件
            - 源码: chasey-dev/immortalwrt-mt798x-rebase (${{ env.REPO_BRANCH }})
            - USB 存储包配置与当前路由器一致
            - 不包含 USB 蜂窝模组驱动或拨号工具
            - MTK HNAT 硬件加速 (turboacc-mtk)

            刷机步骤见 README.md
