name: N60Pro Wired Recovery Build

on:
  workflow_dispatch:
    inputs:
      root_password:
        description: 'Recovery root password (blank uses configs/root-password.txt)'
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  # Same source revision as the audited N60Pro_10 firmware.
  REPO_COMMIT: a99b0888b88f134f56bcb2a7d93027b5d20638a9
  CONFIG_FILE: configs/n60pro-recovery.config

permissions:
  contents: write

concurrency:
  group: n60pro-wired-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask recovery password input
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          password = event.get("inputs", {}).get("root_password", "")
          if password:
              escaped = password.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped)
          PY

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -hT

      - name: Install build and validation dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools \
            python3-dev python3-yaml rsync swig \
            unzip zlib1g-dev file wget curl ccache cmake ninja-build pkgconf libelf-dev \
            libyaml-dev libfdt-dev device-tree-compiler u-boot-tools cpio xz-utils zstd \
            libglib2.0-dev libgmp3-dev libmpc-dev libmpfr-dev libtool autoconf automake \
            libgnutls28-dev liblzma-dev libzstd-dev libreadline-dev patch bzip2

      - name: Clone pinned source into a separate checkout
        run: |
          git init -q recovery-openwrt
          cd recovery-openwrt
          git remote add origin "$REPO_URL"
          git fetch --depth 1 origin "$REPO_COMMIT"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REPO_COMMIT"
          git log -1 --format='%H %s (%cd)' --date=short

      - name: Prepare recovery-only files and feeds
        run: |
          cp configs/n60pro-recovery-feeds.conf recovery-openwrt/feeds.conf.default
          mkdir -p recovery-openwrt/files
          cp -r recovery-overlay/. recovery-openwrt/files/
          # Do not run diy-part1.sh or copy the normal rootfs-overlay.

      - name: Set recovery root password
        working-directory: recovery-openwrt
        env:
          INPUT_ROOT_PASSWORD: ${{ inputs.root_password }}
        run: |
          password_file="$GITHUB_WORKSPACE/configs/root-password.txt"
          shadow_file="package/base-files/files/etc/shadow"
          if [ -n "$INPUT_ROOT_PASSWORD" ]; then
            password="$INPUT_ROOT_PASSWORD"
          elif [ -s "$password_file" ]; then
            if [ "$(awk 'END { print NR }' "$password_file")" -ne 1 ]; then
              echo "::error::Root password file must contain exactly one line"
              exit 1
            fi
            password="$(cat "$password_file")"
          else
            echo "::error::Recovery root password is missing"
            exit 1
          fi
          unset INPUT_ROOT_PASSWORD
          case "$password" in
            ''|*:*|*$'\n'*|*$'\r'*)
              echo "::error::Root password must be nonempty and cannot contain colons or newlines"
              exit 1
              ;;
          esac
          test "$(grep -c '^root:' "$shadow_file")" -eq 1
          root_hash="$(printf '%s' "$password" | openssl passwd -6 -stdin)"
          unset password
          case "$root_hash" in
            '$6$'*) ;;
            *) echo "::error::Failed to hash recovery password"; exit 1 ;;
          esac
          sed -i -E "s|^(root:)[^:]*:|\\1${root_hash}:|" "$shadow_file"
          grep -Fq "root:${root_hash}:" "$shadow_file"
          unset root_hash

      - name: Install pinned upstream feeds
        working-directory: recovery-openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load and validate minimal config
        run: |
          cp "$CONFIG_FILE" recovery-openwrt/.config
          cd recovery-openwrt
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/check-recovery.py" config .config

      - name: Download sources
        working-directory: recovery-openwrt
        run: make download -j8

      - name: Compile recovery
        working-directory: recovery-openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Verify and stage only recovery assets
        run: |
          shopt -s nullglob
          target=recovery-openwrt/bin/targets/mediatek/filogic
          images=("$target"/*-netcore_n60-pro-initramfs-recovery.itb)
          kernels=(recovery-openwrt/build_dir/target-*/linux-mediatek_filogic/linux-*/.config)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::Expected one N60 Pro recovery image"; exit 1; }
          [ "${#kernels[@]}" -ge 1 ] || { echo "::error::No kernel config found"; exit 1; }
          # Per-device rootfs builds a second kernel; the recovery image is the one
          # that keeps initrd support.
          recovery_kernel=""
          args=()
          for cfg in "${kernels[@]}"; do
            args+=(--kernel-config "$cfg")
            grep -qx 'CONFIG_BLK_DEV_INITRD=y' "$cfg" && recovery_kernel="${recovery_kernel:-$cfg}"
          done
          [ -n "$recovery_kernel" ] || { echo "::error::No kernel config enables an initrd"; exit 1; }
          image="${images[0]}"
          manifest="$target/immortalwrt-mediatek-filogic.manifest"
          mkdir -p recovery-upload
          python3 scripts/check-recovery.py image "$image" "${args[@]}" \
            --manifest "$manifest" --report recovery-upload/recovery-check.json
          cp "$image" "$manifest" recovery-upload/
          cp "$target/config.buildinfo" "$target/feeds.buildinfo" "$target/version.buildinfo" recovery-upload/
          cp recovery-openwrt/.config recovery-upload/recovery-config.txt
          cp "$recovery_kernel" recovery-upload/kernel-config.txt
          cp docs/wired-recovery.md recovery-upload/README.md
          printf '%s\n' "$REPO_COMMIT" > recovery-upload/upstream-commit.txt
          (
            cd recovery-upload
            sha256sum *.itb > sha256sums
          )
          {
            echo "### Wired-only N60 Pro recovery"
            echo "- LAN: 10.0.0.1/24, ports LAN1-LAN4, DHCP enabled"
            echo "- SSH only; no Wi-Fi, LuCI, NAT or plugins"
            echo "- Source: $REPO_COMMIT"
            echo "- Static checks passed; hardware boot has not been verified"
            cat recovery-upload/sha256sums
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-wired-recovery-diagnostics
          path: |
            recovery-openwrt/logs
            recovery-openwrt/.config
            recovery-openwrt/build_dir/target-*/linux-mediatek_filogic/linux-*/.config
          if-no-files-found: ignore

      - name: Upload validated recovery
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-wired-recovery
          path: recovery-upload/*
          if-no-files-found: error

      - name: Publish recovery prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N60Pro_WiredRecovery_${{ github.run_number }}_${{ github.run_id }}
          name: N60Pro Wired Recovery ${{ github.run_number }}
          prerelease: true
          files: recovery-upload/*
          body: |
            ## N60 Pro wired-only recovery (not a production firmware)
            - Pinned source: ${{ env.REPO_COMMIT }}
            - LAN1-LAN4: 10.0.0.1/24, DHCP enabled, SSH on LAN only
            - No Wi-Fi, LuCI, plugins or NAT; WAN is not configured
            - Root password: workflow input, or configs/root-password.txt
            - FIT <= 16 MiB; decompressed CPIO <= 64 MiB (project limits)
            - Static checks only; hardware boot is not yet verified
            - No sysupgrade, BL2 or FIP assets are published by this workflow

            Keep the known-good official recovery. Confirm the bootloader
            recovery mode does not write NAND before testing a RAM-only boot.
